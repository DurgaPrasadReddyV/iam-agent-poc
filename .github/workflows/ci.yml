name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: make setup
      - run: make lint
      - run: make type
      - run: make arch

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: make setup
      - run: make test
      - run: make eval          # deterministic evals, mock LLM cassettes, no network

  smoke:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker/docker-compose.yml up -d --build --wait
      - run: make smoke
      - if: always()
        run: docker compose -f docker/docker-compose.yml down -v
